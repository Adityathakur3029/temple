# CI gates for every push and pull request (spec 12 § CI gates).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    # The e2e suite alone takes about 15 min: SwiftShader, one worker, desktop + mobile.
    timeout-minutes: 40
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # tsc --noEmit, ESLint, i18n parity, spec links, release build + size budgets
      - run: npm run check

      # Unit tests (protocol, web, tools) and Durable Object tests (realtime, in workerd)
      - run: npm test

      - run: npx playwright install --with-deps chromium

      # Smoke test against `npm run dev:realtime` + `npm run dev:web`, desktop and mobile emulation
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
