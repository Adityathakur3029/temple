<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efe9df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141d18" media="(prefers-color-scheme: dark)" />
    <title>{{en:boot.title}}</title>
    <link rel="icon" type="image/svg+xml" href="{{favicon:ui/shikhara.svg}}" />
    <!-- Picks <html lang> before first paint. prettier-ignore keeps the build token intact. -->
    <!-- prettier-ignore -->
    <script>{{script:i18n/detect-lang.js}}</script>
    <style>
      /* Critical CSS for the boot, unsupported and error screens. Works without JS. */
      :root {
        --bg: #efe9df;
        --fg: #1f2d26;
        --muted: #4f5e55;
        --mark: #6f6253;
        --panel: rgba(31, 45, 38, 0.07);
        --line: rgba(31, 45, 38, 0.28);
        --accent: #8a6a2a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141d18;
          --fg: #ece5d8;
          --muted: #b3bdb6;
          --mark: #cdbfa8;
          --panel: rgba(236, 229, 216, 0.08);
          --line: rgba(236, 229, 216, 0.3);
          --accent: #d4a94f;
        }
      }
      html[lang="en"] [data-l="hi"],
      html[lang="hi"] [data-l="en"] {
        display: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans",
          "Noto Sans Devanagari",
          "Nirmala UI",
          sans-serif;
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(96px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: var(--bg);
        text-align: center;
        transition:
          opacity 0.6s ease,
          visibility 0.6s;
      }
      .boot-mark {
        width: 72px;
        height: 72px;
        color: var(--mark);
      }
      /* Breathes only while actually loading, never on the unsupported or error screens. */
      [data-screen="boot"] .boot-mark {
        animation: boot-breathe 3s ease-in-out infinite;
      }
      .boot-mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .boot-title {
        margin: 4px 0 0;
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .boot-msg {
        display: none;
        max-width: 32ch;
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }
      [data-screen="boot"] .boot-opening,
      [data-screen="unsupported"] .boot-unsupported,
      [data-screen="error"] .boot-error {
        display: block;
      }
      .boot-error p {
        margin: 0 0 16px;
      }
      .boot-button,
      .boot-retry {
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        line-height: 1.4;
        text-decoration: none;
        cursor: pointer;
      }
      .boot-retry {
        margin-top: 8px;
        visibility: hidden;
        opacity: 0;
        /* CSS-only: appears after 15 s if the temple hasn't opened (spec 07). */
        animation: boot-reveal 0.6s ease 15s forwards;
      }
      body:not([data-screen="boot"]) .boot-retry {
        display: none;
      }
      .boot-lang {
        position: absolute;
        bottom: max(24px, env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
      }
      .boot-lang [aria-pressed="true"] {
        border: 2px solid var(--accent);
        padding: 9px 17px;
        font-weight: 600;
      }
      .boot-button:focus-visible,
      .boot-retry:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [data-screen="temple"] .boot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.6;
        }
      }
      @keyframes boot-reveal {
        to {
          visibility: visible;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        [data-screen="boot"] .boot-mark {
          animation: none;
        }
        .boot {
          transition: none;
        }
        .boot-retry {
          animation-duration: 0s;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-screen="boot">
    <main class="boot">
      <div class="boot-mark" aria-hidden="true">{{svg:ui/shikhara.svg}}</div>
      <h1 class="boot-title">{{t:boot.title}}</h1>
      <p class="boot-msg boot-opening" role="status">{{t:boot.opening}}</p>
      <p class="boot-msg boot-unsupported">{{t:unsupported.title}}</p>
      <div class="boot-msg boot-error" role="alert">
        <p>{{t:boot.error}}</p>
        <button type="button" class="boot-button" data-action="retry">{{t:boot.retry}}</button>
      </div>
      <a class="boot-retry" href="">{{t:boot.retry}}</a>
      <div class="boot-lang">
        <button type="button" class="boot-button" data-lang="hi" lang="hi">{{raw:lang.hi}}</button>
        <button type="button" class="boot-button" data-lang="en" lang="en">{{raw:lang.en}}</button>
      </div>
    </main>
  </body>
</html>
